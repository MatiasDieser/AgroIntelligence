services:
  db:
    image: postgis/postgis:16-3.4
    container_name: droneagro_db
    shm_size: 256mb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin321*
      POSTGRES_DB: agro_vault_db
    ports:
      - "5432:5432"
    volumes:
      - droneagro_data:/var/lib/postgresql/data

volumes:
  droneagro_data: