<svg viewBox="0 0 820 620" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/></marker>
  </defs>

  <rect width="820" height="620" fill="white"/>

  <!-- ZONA CAMPO -->
  <rect x="10" y="10" width="190" height="280" rx="8" fill="#f0f9ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="105" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">CAMPO</text>

  <rect x="30" y="45" width="150" height="70" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="65" text-anchor="middle" font-weight="bold" fill="#1e40af">DRON</text>
  <text x="105" y="82" text-anchor="middle" fill="#374151">Cámara RGB /</text>
  <text x="105" y="96" text-anchor="middle" fill="#374151">Multiespectral</text>
  <text x="105" y="110" text-anchor="middle" fill="#374151">MicroSD local</text>

  <rect x="30" y="135" width="150" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="155" text-anchor="middle" font-weight="bold" fill="#1e40af">APP MÓVIL</text>
  <text x="105" y="172" text-anchor="middle" fill="#374151">DJI Fly / SDK</text>
  <text x="105" y="186" text-anchor="middle" fill="#374151">Trigger de subida</text>

  <rect x="30" y="215" width="150" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="235" text-anchor="middle" font-weight="bold" fill="#1e40af">PILOTO</text>
  <text x="105" y="252" text-anchor="middle" fill="#374151">Manual o misión</text>
  <text x="105" y="266" text-anchor="middle" fill="#374151">planificada</text>

  <line x1="105" y1="115" x2="105" y2="133" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ZONA SERVIDOR -->
  <rect x="260" y="10" width="340" height="560" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="430" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">SERVIDOR / NOTEBOOK</text>

  <rect x="280" y="45" width="300" height="80" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="430" y="68" text-anchor="middle" font-weight="bold" fill="#166534">API .NET (ASP.NET Core)</text>
  <text x="430" y="87" text-anchor="middle" fill="#374151">Recibe archivos · Auth de usuarios</text>
  <text x="430" y="103" text-anchor="middle" fill="#374151">Gestión de trabajos · BD (PostgreSQL)</text>

  <rect x="280" y="150" width="300" height="55" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="430" y="172" text-anchor="middle" font-weight="bold" fill="#166534">COLA DE MENSAJES</text>
  <text x="430" y="190" text-anchor="middle" fill="#374151">RabbitMQ / carpeta watcheada</text>

  <rect x="280" y="230" width="300" height="130" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="430" y="252" text-anchor="middle" font-weight="bold" fill="#166534">WORKER PYTHON</text>
  <text x="430" y="272" text-anchor="middle" fill="#374151">1. Fotogrametría (OpenDroneMap)</text>
  <text x="430" y="289" text-anchor="middle" fill="#374151">2. Cálculo índices (NDVI, NDRE…)</text>
  <text x="430" y="306" text-anchor="middle" fill="#374151">3. Detección objetos (YOLO)</text>
  <text x="430" y="323" text-anchor="middle" fill="#374151">4. Segmentación zonas críticas</text>
  <text x="430" y="340" text-anchor="middle" fill="#374151">5. Extrae estadísticas del campo</text>

  <rect x="280" y="385" width="300" height="80" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="430" y="407" text-anchor="middle" font-weight="bold" fill="#166534">MÓDULO IA / LLM</text>
  <text x="430" y="425" text-anchor="middle" fill="#374151">Interpreta estadísticas</text>
  <text x="430" y="443" text-anchor="middle" fill="#374151">Genera texto del informe (Claude API)</text>
  <text x="430" y="461" text-anchor="middle" fill="#374151">Produce PDF final</text>

  <rect x="280" y="490" width="300" height="60" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="430" y="515" text-anchor="middle" font-weight="bold" fill="#166534">ALMACENAMIENTO</text>
  <text x="430" y="533" text-anchor="middle" fill="#374151">Imágenes · Ortomosaicos · PDFs</text>

  <line x1="430" y1="125" x2="430" y2="148" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="430" y1="205" x2="430" y2="228" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="430" y1="360" x2="430" y2="383" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="430" y1="465" x2="430" y2="488" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- ZONA CLIENTE -->
  <rect x="660" y="10" width="150" height="280" rx="8" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="735" y="30" text-anchor="middle" font-size="11" font-weight="bold" fill="#7e22ce">CLIENTE</text>

  <rect x="675" y="45" width="120" height="70" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="735" y="68" text-anchor="middle" font-weight="bold" fill="#6b21a8">PORTAL WEB</text>
  <text x="735" y="85" text-anchor="middle" fill="#374151">Ver mapas</text>
  <text x="735" y="100" text-anchor="middle" fill="#374151">Historial</text>

  <rect x="675" y="135" width="120" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="735" y="157" text-anchor="middle" font-weight="bold" fill="#6b21a8">INFORME PDF</text>
  <text x="735" y="175" text-anchor="middle" fill="#374151">Mapas + análisis</text>

  <rect x="675" y="215" width="120" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="735" y="235" text-anchor="middle" font-weight="bold" fill="#6b21a8">GIS EXPORT</text>
  <text x="735" y="253" text-anchor="middle" fill="#374151">Shapefile / KMZ</text>
  <text x="735" y="268" text-anchor="middle" fill="#374151">para el agrónomo</text>

  <!-- Flechas campo → servidor -->
  <line x1="180" y1="165" x2="278" y2="100" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr2)"/>
  <text x="195" y="120" font-size="10" fill="#2563eb" transform="rotate(-20,195,120)">WiFi / señal</text>
  <line x1="180" y1="190" x2="278" y2="85" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Flechas servidor → cliente -->
  <line x1="580" y1="80" x2="673" y2="80" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="580" y1="165" x2="673" y2="165" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="580" y1="245" x2="673" y2="245" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Leyenda -->
  <rect x="10" y="310" width="190" height="110" rx="6" fill="#fafafa" stroke="#d1d5db" stroke-width="1"/>
  <text x="105" y="328" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">LEYENDA</text>
  <line x1="25" y1="342" x2="65" y2="342" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="70" y="346" font-size="10" fill="#374151">Subida WiFi/automática</text>
  <line x1="25" y1="360" x2="65" y2="360" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="70" y="364" font-size="10" fill="#374151">Copia manual (microSD)</text>
  <line x1="25" y1="378" x2="65" y2="378" stroke="#16a34a" stroke-width="2"/>
  <text x="70" y="382" font-size="10" fill="#374151">Flujo interno servidor</text>
  <line x1="25" y1="396" x2="65" y2="396" stroke="#7c3aed" stroke-width="2"/>
  <text x="70" y="400" font-size="10" fill="#374151">Entrega al cliente</text>
</svg>
